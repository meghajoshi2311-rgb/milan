<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Shop Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#101828; --muted:#566074; --line:#E4E7EC; --line2:#EEF0F4;
  --accent:#1D3F72; --accent-ink:#FFFFFF; --accent-soft:#E8EEF8;
  --good:#0E7A4B; --good-soft:#E3F4EC; --bad:#B42318; --bad-soft:#FDECEA; --warn:#B54708; --focus:#2F6FED;
  --font:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --card:#171B22; --ink:#EEF1F6; --muted:#A3ACBC; --line:#272D38; --line2:#1F242D;
    --accent:#7FA6E8; --accent-ink:#0B1730; --accent-soft:#1B2740;
    --good:#5FD39A; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F5A340; --focus:#7FA6E8;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --card:#171B22; --ink:#EEF1F6; --muted:#A3ACBC; --line:#272D38; --line2:#1F242D;
  --accent:#7FA6E8; --accent-ink:#0B1730; --accent-soft:#1B2740;
  --good:#5FD39A; --good-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1B19; --warn:#F5A340; --focus:#7FA6E8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);min-height:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--card);z-index:80}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,.in:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{min-width:0}
.brand h1{font:700 17px/1.3 var(--font);margin:0;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:6px;margin:1px 0 0;font:500 12px/1.3 var(--font);color:var(--muted)}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--good)}
.status.warn i{background:var(--warn)}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--font);padding:0 10px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 112px}
.loading{color:var(--muted);padding:40px 0;text-align:center}

/* date bar */
.datebar{display:flex;align-items:stretch;gap:8px;margin:16px 0 14px}
.datebar .ic{width:44px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}
.datebar .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.datebar .ic:disabled{opacity:.35;cursor:default}
.datepick{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  border-radius:10px;background:var(--card);border:1px solid var(--line);padding:4px 8px;text-align:center}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dl{font:600 15px/1.3 var(--font)}
.dsub{font:500 12px/1.3 var(--font);color:var(--accent)}
.tolink{display:block;margin:-6px auto 12px;border:0;background:transparent;color:var(--accent);font:600 13.5px var(--font);padding:6px 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.lab{font:600 11.5px/1.3 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
html[data-lang="hi"] .lab{text-transform:none;letter-spacing:0;font-size:13px}

/* summary */
.sum{padding:16px 16px 0;margin-bottom:16px;border-top:3px solid var(--line);overflow:hidden}
.sum.good{border-top-color:var(--good)} .sum.bad{border-top-color:var(--bad)}
.sum-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font:600 12px/1 var(--font);padding:5px 9px;border-radius:99px}
.sum.good .chip{background:var(--good-soft);color:var(--good)} .sum.bad .chip{background:var(--bad-soft);color:var(--bad)}
.big{font:700 36px/1.15 var(--font);margin:6px 0 2px;letter-spacing:-.02em;word-break:break-word}
.sum.good .big{color:var(--good)} .sum.bad .big{color:var(--bad)}
.sub{font:400 13px/1.45 var(--font);color:var(--muted);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -16px;border-top:1px solid var(--line)}
.kpis div{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.kpis div:first-child{border-left:0}
.kpis span{display:block;font:500 12px/1.35 var(--font);color:var(--muted)}
.kpis b{display:block;font:600 16px/1.4 var(--font);word-break:break-word}

/* entry groups */
.grp{margin:0 0 14px}
.grp h3{margin:0 2px 6px}
.grp .card{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;color:inherit;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.ico{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rt{flex:1;min-width:0}
.rt b{display:block;font:600 15px/1.35 var(--font)}
.rt small{display:block;font:400 12.5px/1.4 var(--font);color:var(--muted)}
.rv{text-align:right;flex:none}
.rv b{display:block;font:600 16px/1.35 var(--font)}
.rv small{display:block;font:400 12px/1.4 var(--font);color:var(--muted)}
.plus{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent)}
.plus svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* ledger cards */
.led{padding:14px 16px 0;margin-bottom:14px;overflow:hidden}
.led h2{font:600 15px/1.35 var(--font);margin:0}
.led p{font:400 12.5px/1.45 var(--font);color:var(--muted);margin:2px 0 6px}
.lr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.lr b{font-weight:600;white-space:nowrap}
.lr.strong{font-weight:600}
.lr.cut{border-top:1px solid var(--line);margin-top:4px}
.lr.tot{border-bottom:0;margin:8px -16px 0;padding:13px 16px;background:var(--accent-soft);font-weight:700}
.lr.tot b{font-size:18px;font-weight:700}
.lr.tot.good{background:var(--good-soft);color:var(--good)} .lr.tot.bad{background:var(--bad-soft);color:var(--bad)}

/* entry feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.feed li:last-child{border-bottom:0}
.fm{flex:1;min-width:0}
.fm b{display:block;font:600 14.5px/1.4 var(--font);overflow-wrap:anywhere}
.fm b.none{color:var(--muted);font-weight:500}
.fm span{display:block;font:400 12.5px/1.4 var(--font);color:var(--muted)}
.fa{font:600 15px/1.4 var(--font);white-space:nowrap}
.fm .tag,.tag{display:inline-block;font:600 11px/1.3 var(--font);padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.hint{font:400 13px/1.5 var(--font);color:var(--muted);margin:6px 2px 0}
.empty-card{padding:16px;color:var(--muted);font-size:14px}

/* bottom sheet */
.sheetwrap{position:fixed;inset:0;z-index:70;display:none}
.sheetwrap.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.5);opacity:0;transition:opacity .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;
  background:var(--card);border-radius:16px 16px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);transition:transform .22s ease;box-shadow:0 -8px 32px rgba(16,24,40,.22)}
.sheetwrap.show .scrim{opacity:1}
.sheetwrap.show .panel{transform:none}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;gap:12px}
.sh-t{flex:1;min-width:0}
.sh-t h2{font:700 17px/1.3 var(--font);margin:0}
.sh-t p{font:400 12.5px/1.4 var(--font);color:var(--muted);margin:1px 0 0}
.x{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.x.armed{width:auto;padding:0 10px;background:var(--bad-soft);color:var(--bad);font:600 12.5px var(--font)}
.sh-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 4px;padding:11px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.sh-sum span{font-size:13px;color:var(--muted)}
.sh-sum b{font:700 18px var(--font)}
.sform{display:grid;gap:12px;margin:14px 0 4px}
.lbl{display:block;font:600 13px var(--font);color:var(--muted);margin:0 0 5px}
.in{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:500 16px var(--font);background:var(--card);color:var(--ink)}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.amtbox{position:relative}
.amtbox span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:600 18px var(--font);color:var(--muted)}
.amtbox .in{height:54px;padding-left:34px;font:600 22px var(--font)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 14px var(--font)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:600 15px var(--font);text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.ent{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.ent li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);min-height:54px}
.ent .nt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.ent .nt small{display:block;color:var(--muted);font:400 12px/1.4 var(--font)}
.ent .nt.none{color:var(--muted)}
.ent .am{font:600 15.5px var(--font);white-space:nowrap}
.ent li.empty{color:var(--muted);font-size:13.5px;border-bottom:0;min-height:0;padding:12px 0 4px}

/* reports */
.segtop{margin:16px 0 0}
.chartbox{padding:14px 12px 6px;margin-bottom:14px}
.chartbox h2{font:600 15px/1.35 var(--font);margin:0 0 6px 4px}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .bar.g{fill:var(--good)} .chartbox .bar.b{fill:var(--bad)}
.chartbox text{fill:var(--muted);font:500 9.5px var(--font)}
.tblwrap{padding:4px 14px 6px}
.trow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.05fr;gap:6px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line2);background:transparent;color:inherit;font:500 14px var(--font);text-align:right;align-items:center}
.trow>:first-child{text-align:left}
.trow.head{font:600 12px var(--font);color:var(--muted);cursor:default;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.trow.dim{color:var(--muted)}
.trow.foot{border-top:1px solid var(--line);border-bottom:0;cursor:default;font-weight:600}
.trow b{font-weight:600}
button.trow{cursor:pointer}
button.trow:active{background:var(--bg)}
.good{color:var(--good)} .bad{color:var(--bad)}

/* settings */
.pg{font:700 20px/1.3 var(--font);margin:18px 0 4px}
.setrow{margin:16px 0}
.note{font:400 13.5px/1.55 var(--font);color:var(--muted);margin:6px 0 0}
.stack{display:grid;gap:10px}
.formula{padding:14px 16px;margin-top:22px}
.formula h2{font:600 15px/1.35 var(--font);margin:0 0 6px}
.formula p{font:400 13.5px/1.5 var(--font);margin:0;padding:8px 0;border-top:1px solid var(--line2);color:var(--ink)}
.formula p:first-of-type{border-top:0}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:transparent;color:var(--muted);font:600 12px var(--font);border-radius:10px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:500 14px var(--font);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1 id="shop"></h1><p class="status" id="status"></p></div>
  <div class="lang" id="langSeg" role="group" aria-label="Language"></div>
</div></header>
<div class="wrap"><main id="view"><p class="loading">Loading…</p></main></div>
<nav class="nav" id="nav" aria-label="Main"></nav>

<div class="sheetwrap" id="sheetWrap">
  <div class="scrim" data-a="sclose"></div>
  <div class="panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sh_title"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const normEntry = e => ({id: (e && e.id) || uid(), amt: num(e && e.amt), note: (e && e.note) || '', ts: num(e && e.ts), m: (e && e.m === 'online') ? 'online' : 'cash'});
const normDay = d => {
  d = d || {};
  const o = {};
  CATS.forEach(k => {
    let src = Array.isArray(d[k]) ? d[k] : [];
    if (k === 'csale' && Array.isArray(d.sale)) src = src.concat(d.sale);   /* older versions */
    if (k === 'cpur' && Array.isArray(d.pur)) src = src.concat(d.pur);
    o[k] = src.map(normEntry);
  });
  o.bills = Array.isArray(d.bills) ? d.bills : [];   /* older bills and "home" entries are kept untouched, just not shown */
  o.home = Array.isArray(d.home) ? d.home : [];
  return o;
};
const emptyDay = () => normDay(null);
const normMeta = m => Object.assign({}, m || {}, {shop: (m && m.shop) || '', locale: (m && ['en', 'hl', 'hi'].indexOf(m.locale) >= 0) ? m.locale : 'en'});

function totals(d) {
  const z = {open: 0, csale: 0, osale: 0, cpur: 0, opur: 0, expC: 0, expO: 0, exp: 0,
    sale: 0, pur: 0, gross: 0, profit: 0, cash: 0, online: 0, any: false};
  const D = state.days[d];
  if (!D) return z;
  z.open = sum(D.open); z.csale = sum(D.csale); z.osale = sum(D.osale);
  z.cpur = sum(D.cpur); z.opur = sum(D.opur);
  z.expC = sum(D.exp.filter(e => e.m !== 'online')); z.expO = sum(D.exp.filter(e => e.m === 'online'));
  z.exp = r2(z.expC + z.expO);
  z.sale = r2(z.csale + z.osale); z.pur = r2(z.cpur + z.opur);
  z.gross = r2(z.sale - z.pur); z.profit = r2(z.gross - z.exp);
  z.cash = r2(z.open + z.csale - z.cpur - z.expC);
  z.online = r2(z.osale - z.opur - z.expO);
  z.any = CATS.some(k => D[k].length > 0);
  return z;
}
const FIELDS = ['open', 'csale', 'osale', 'cpur', 'opur', 'expC', 'expO'];
function agg(prefix) {
  const r = {n: 0};
  FIELDS.forEach(f => r[f] = 0);
  Object.keys(state.days).forEach(d => {
    if (d.indexOf(prefix) !== 0) return;
    const x = totals(d);
    if (!x.any) return;
    FIELDS.forEach(f => r[f] += x[f]);
    r.n++;
  });
  FIELDS.forEach(f => r[f] = r2(r[f]));
  r.exp = r2(r.expC + r.expO);
  r.sale = r2(r.csale + r.osale); r.pur = r2(r.cpur + r.opur);
  r.gross = r2(r.sale - r.pur); r.profit = r2(r.gross - r.exp);
  r.cash = r2(r.open + r.csale - r.cpur - r.expC);
  r.online = r2(r.osale - r.opur - r.expO);
  r.any = r.n > 0;
  return r;
}

const Store = {
  mode: 'local', col: null, q: Promise.resolve(), migrated: false,
  async init() {
    let db = null, id = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const probe = (async () => {
          const d = await window.claude.use('db');
          const u = await window.claude.use('user');
          const i = (d && u) ? await u.id() : null;
          return {d, i};
        })();
        const res = await Promise.race([probe, new Promise(r => setTimeout(() => r(null), 6000))]);
        if (res && res.d && res.i) { db = res.d; id = res.i; }
      }
    } catch (e) { console.warn(e); }
    if (db && id) {
      try {
        this.col = db.collection('data/users/' + id);
        await this.loadDb();
        this.mode = 'db';
        return;
      } catch (e) { console.error(e); this.col = null; }
    }
    try { localStorage.setItem(KEY + '_t', '1'); localStorage.removeItem(KEY + '_t'); this.mode = 'local'; }
    catch (e) { this.mode = 'memory'; }
    const saved = this.readLocal();
    if (saved) { state.meta = normMeta(saved.meta); state.days = {}; Object.keys(saved.days || {}).forEach(d => state.days[d] = normDay(saved.days[d])); }
  },
  readLocal() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  saveLocal() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem(KEY, JSON.stringify({meta: state.meta, days: state.days})); }
    catch (e) { toast(t('saveFail'), true); }
  },
  async loadDb() {
    const snap = await this.col.get();
    const days = {}; let meta = null;
    snap.docs.forEach(d => {
      const data = d.data();
      if (!data) return;
      if (d.id === 'meta') meta = data;
      else if (d.id.indexOf('d_') === 0) days[d.id.slice(2)] = normDay(data);
    });
    if (!meta && !Object.keys(days).length) {
      const saved = this.readLocal();
      if (saved && saved.days && Object.keys(saved.days).length) {
        state.meta = normMeta(saved.meta); state.days = {};
        Object.keys(saved.days).forEach(d => state.days[d] = normDay(saved.days[d]));
        this.migrated = true; this.mode = 'db'; this.saveAll();
        return;
      }
      state.meta = normMeta(null); state.days = {};
    } else { state.meta = normMeta(meta); state.days = days; }
  },
  enqueue(job) {
    this.q = this.q.then(job).catch(e => { console.error(e); toast(t('saveFail'), true); });
    return this.q;
  },
  async retry(fn) {
    for (let i = 0; i < 4; i++) {
      try { return await fn(); }
      catch (e) {
        const c = e && e.code;
        if (i < 3 && (c === 'unavailable' || c === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 700 * (i + 1))); continue; }
        throw e;
      }
    }
  },
  saveDay(d) {
    if (this.mode === 'db') {
      const body = Object.assign({date: d}, clone(state.days[d]));
      this.enqueue(() => this.retry(() => this.col.doc('d_' + d).set(body)));
    } else this.saveLocal();
  },
  saveMeta() {
    if (this.mode === 'db') {
      const body = clone(state.meta);
      this.enqueue(() => this.retry(() => this.col.doc('meta').set(body)));
    } else this.saveLocal();
  },
  saveAll() {
    if (this.mode !== 'db') { this.saveLocal(); return Promise.resolve(); }
    const metaBody = clone(state.meta);
    const days = Object.keys(state.days).map(d => [d, Object.assign({date: d}, clone(state.days[d]))]);
    return this.enqueue(async () => {
      await this.retry(() => this.col.doc('meta').set(metaBody));
      for (const [d, body] of days) await this.retry(() => this.col.doc('d_' + d).set(body));
    });
  }
};

  `<button data-a="lang" data-l="${x[0]}" aria-pressed="${lang === x[0]}">${x[1]}</button>`).join('');

function render() {
  document.documentElement.lang = lang === 'en' ? 'en' : lang === 'hl' ? 'hi-Latn' : 'hi';
  document.documentElement.dataset.lang = lang;
  $('shop').textContent = state.meta.shop || t('shop');
  const mode = Store.mode, st = $('status');
  st.className = 'status' + (mode === 'db' ? '' : ' warn');
  st.innerHTML = '<i></i>' + esc(mode === 'db' ? t('stDb') : mode === 'local' ? t('stLocal') : t('stMem'));
  $('langSeg').innerHTML = langBtns();
  $('nav').innerHTML = [['day', 'navDay'], ['rep', 'navRep'], ['set', 'navSet']].map(x =>
    `<button data-a="tab" data-t="${x[0]}" ${ui.tab === x[0] ? 'aria-current="page"' : ''}>${ICON[x[0]]}<span>${t(x[1])}</span></button>`).join('');
  const view = $('view');
  if (!ui.ready) { view.innerHTML = `<p class="loading">${t('loading')}</p>`; return; }
  view.innerHTML = ui.tab === 'day' ? renderDay() : ui.tab === 'rep' ? renderRep() : renderSet();
}

function summary(r) {
  const cls = !r.any ? '' : (r.profit >= 0 ? 'good' : 'bad');
  const label = !r.any ? t('netPL') : (r.profit >= 0 ? t('netProfit') : t('netLoss'));
  const chip = r.any ? `<span class="chip">${r.profit >= 0 ? t('tProfit') : t('tLoss')}</span>` : '';
  const sub = r.any ? t('gross', {v: money(r.gross)}) : t('idleHint');
  return `<section class="card sum ${cls}"><div class="sum-h"><span class="lab">${esc(label)}</span>${chip}</div>` +
    `<p class="big">${money(r.any ? Math.abs(r.profit) : 0)}</p><p class="sub">${esc(sub)}</p>` +
    `<div class="kpis"><div><span>${t('kSales')}</span><b>${money(r.sale)}</b></div><div><span>${t('kPurch')}</span><b>${money(r.pur)}</b></div><div><span>${t('kExp')}</span><b>${money(r.exp)}</b></div></div></section>`;
}

const lrow = (label, val, cls) => `<div class="lr ${cls || ''}"><span>${esc(label)}</span><b>${val}</b></div>`;

function cashCard(r) {
  return `<section class="card led"><h2>${t('cashT')}</h2><p>${t('cashS')}</p>` +
    lrow(t('rOpen'), '+ ' + money(r.open)) + lrow(t('rCSale'), '+ ' + money(r.csale)) +
    lrow(t('rCPur'), '− ' + money(r.cpur)) + lrow(t('rCExp'), '− ' + money(r.expC)) +
    lrow(t('rCash'), money(r.cash), 'tot' + (r.cash < 0 ? ' bad' : '')) + '</section>';
}
function onlineCard(r) {
  return `<section class="card led"><h2>${t('onT')}</h2><p>${t('onS')}</p>` +
    lrow(t('rOSale'), '+ ' + money(r.osale)) + lrow(t('rOPur'), '− ' + money(r.opur)) + lrow(t('rOExp'), '− ' + money(r.expO)) +
    lrow(t('rOnline'), money(r.online), 'tot' + (r.online < 0 ? ' bad' : '')) + '</section>';
}

function renderDay() {
  const d = ui.date, D = state.days[d] || emptyDay(), r = totals(d);
  const dt = parseYmd(d), isToday = d === TODAY();
  const lab = dt.toLocaleDateString(LOC(), {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  let h = `<div class="datebar"><button class="ic" data-a="dprev" aria-label="${t('prevDay')}">${ICON.left}</button>` +
    `<label class="datepick"><span class="dl">${esc(lab)}</span>${isToday ? `<span class="dsub">${t('today')}</span>` : ''}` +
    `<input type="date" id="dpick" value="${d}" max="${TODAY()}" aria-label="${t('pickDate')}"></label>` +
    `<button class="ic" data-a="dnext" aria-label="${t('nextDay')}" ${d >= TODAY() ? 'disabled' : ''}>${ICON.right}</button></div>`;
  if (!isToday) h += `<button class="tolink" data-a="dtoday">${t('toToday')}</button>`;
  h += summary(r);
  h += `<p class="lab" style="margin:4px 2px 10px">${t('secAdd')}</p>`;
  GROUPS.forEach(g => {
    h += `<div class="grp"><h3 class="lab">${t(g[0])}</h3><div class="card">` + g[1].map(k => {
      const n = D[k].length, tot = k === 'exp' ? r.exp : r[k];
      return `<button class="row" data-a="opensheet" data-k="${k}"><span class="ico">${ICON[k]}</span>` +
        `<span class="rt"><b>${t('c_' + k)}</b><small>${t('h_' + k)}</small></span>` +
        `<span class="rv"><b>${money(tot)}</b><small>${n === 0 ? t('e0') : n === 1 ? t('e1') : t('eN', {n})}</small></span>` +
        `<span class="plus">${ICON.plus}</span></button>`;
    }).join('') + `</div></div>`;
  });
  h += cashCard(r) + onlineCard(r);
  const all = [];
  CATS.forEach(k => D[k].forEach((e, i) => all.push({k, e, i})));
  all.sort((a, b) => (b.e.ts - a.e.ts) || (b.i - a.i));
  h += `<p class="lab" style="margin:18px 2px 8px">${t('feedT')}</p>`;
  h += all.length
    ? `<div class="card"><ul class="feed">${all.map(x => `<li><span class="ico">${ICON[x.k]}</span><div class="fm"><b class="${x.e.note ? '' : 'none'}">${x.e.note ? esc(x.e.note) : t('noNote')}</b>` +
        `<span>${t('c_' + x.k)}${x.k === 'exp' && x.e.m === 'online' ? `<span class="tag">${t('tagOnline')}</span>` : ''}</span></div><span class="fa">${SIGN[x.k]} ${money(x.e.amt)}</span></li>`).join('')}</ul></div>`
    : `<div class="card empty-card">${t('noEntries')}</div>`;
  return h;
}

/* ===== bottom sheet ===== */
function sheetListHtml() {
  const k = ui.sheet, D = state.days[ui.date] || emptyDay();
  const list = D[k].slice().sort((a, b) => b.ts - a.ts);
  if (!list.length) return `<li class="empty">${t('sheetEmpty')}</li>`;
  return list.map(e => {
    const armed = ui.del === k + ':' + e.id;
    const tm = e.ts ? new Date(e.ts).toLocaleTimeString(LOC(), {hour: 'numeric', minute: '2-digit'}) : '';
    return `<li><span class="nt ${e.note ? '' : 'none'}">${e.note ? esc(e.note) : t('noNote')}${k === 'exp' && e.m === 'online' ? `<span class="tag">${t('tagOnline')}</span>` : ''}${tm ? `<small>${tm}</small>` : ''}</span>` +
      `<span class="am">${money(e.amt)}</span><button class="x ${armed ? 'armed' : ''}" data-a="del" data-id="${e.id}" aria-label="${t('del')}">${armed ? t('delSure') : ICON.close}</button></li>`;
  }).join('');
}
function sheetTotal() { const r = totals(ui.date); return ui.sheet === 'exp' ? r.exp : r[ui.sheet]; }
function buildSheet() {
  const k = ui.sheet;
  const dt = parseYmd(ui.date).toLocaleDateString(LOC(), {weekday: 'short', day: 'numeric', month: 'short'});
  $('sheetPanel').innerHTML = `<div class="grab"></div>
  <div class="sh-h"><span class="ico">${ICON[k]}</span><div class="sh-t"><h2 id="sh_title">${t('c_' + k)}</h2><p>${t('h_' + k)}</p></div><button class="x" data-a="sclose" aria-label="${t('close')}">${ICON.close}</button></div>
  <div class="sh-sum"><span>${esc(t('totalFor', {d: dt}))}</span><b id="sh_tot">${money(sheetTotal())}</b></div>
  <div class="sform">
    <div><label class="lbl" for="s_amt">${t('amt')}</label><div class="amtbox"><span>₹</span><input class="in" id="s_amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div></div>
    <div><label class="lbl" for="s_note">${t('note')}</label><input class="in" id="s_note" type="text" autocomplete="off" placeholder="${esc(t('n_' + k))}"></div>
    ${k === 'exp' ? `<div><p class="lbl">${t('paidBy')}</p><div class="seg" id="s_mode"><button data-a="smode" data-m="cash" aria-pressed="${ui.mode === 'cash'}">${t('cash')}</button><button data-a="smode" data-m="online" aria-pressed="${ui.mode === 'online'}">${t('online')}</button></div></div>` : ''}
    <button class="btn primary wide" data-a="sadd">${t('addEntry')}</button>
  </div>
  <ul class="ent" id="sList">${sheetListHtml()}</ul>`;
}
function refreshSheet() {
  const l = $('sList'), tt = $('sh_tot');
  if (l) l.innerHTML = sheetListHtml();
  if (tt) tt.textContent = money(sheetTotal());
}
function openSheet(k) {
  ui.sheet = k; ui.mode = 'cash'; ui.del = null;
  buildSheet();
  const w = $('sheetWrap');
  w.classList.add('on');
  document.body.style.overflow = 'hidden';
  const a = $('s_amt'); if (a) { try { a.focus({preventScroll: true}); } catch (e) { a.focus(); } }
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('show')));
}
function closeSheet() {
  const w = $('sheetWrap');
  ui.sheet = null; ui.del = null;
  w.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { if (!ui.sheet) w.classList.remove('on'); }, 260);
}

/* ===== reports ===== */
function chartSvg(vals, labels, every, aria) {
  const W = 320, H = 140, top = 10, bot = H - 22, span = bot - top;
  const mp = Math.max(0, ...vals.map(v => v || 0)), mn = Math.max(0, ...vals.map(v => -(v || 0)));
  const k = span / ((mp + mn) || 1), y0 = top + mp * k;
  const n = vals.length, slot = (W - 12) / n, bw = Math.max(2, slot * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><line x1="6" x2="${W - 6}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  vals.forEach((v, i) => {
    const x = 6 + i * slot + (slot - bw) / 2;
    if (v) {
      const h = Math.max(2, Math.abs(v) * k), y = v > 0 ? y0 - h : y0;
      s += `<rect class="bar ${v > 0 ? 'g' : 'b'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2, bw / 2).toFixed(1)}"/>`;
    }
    if (i % every === 0) s += `<text x="${(6 + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s + '</svg>';
}

function renderRep() {
  const month = ui.repMode === 'month';
  let label, prefix;
  if (month) {
    const p = ui.repYm.split('-').map(Number);
    label = new Date(p[0], p[1] - 1, 1).toLocaleDateString(LOC(), {month: 'long', year: 'numeric'});
    prefix = ui.repYm;
  } else { label = String(ui.repY); prefix = label; }
  const atMax = month ? ui.repYm >= TODAY().slice(0, 7) : ui.repY >= now.getFullYear();
  let h = `<div class="seg segtop"><button data-a="repmode" data-m="month" aria-pressed="${month}">${t('month')}</button><button data-a="repmode" data-m="year" aria-pressed="${!month}">${t('year')}</button></div>` +
    `<div class="datebar"><button class="ic" data-a="repprev" aria-label="${t('prev')}">${ICON.left}</button><div class="datepick"><span class="dl">${esc(label)}</span></div><button class="ic" data-a="repnext" aria-label="${t('next')}" ${atMax ? 'disabled' : ''}>${ICON.right}</button></div>`;
  const r = agg(prefix);
  h += summary(r);

  let vals = [], labels = [], every = 1;
  if (month) {
    const p = ui.repYm.split('-').map(Number), dim = new Date(p[0], p[1], 0).getDate();
    for (let i = 1; i <= dim; i++) { const x = totals(ui.repYm + '-' + pad(i)); vals.push(x.any ? x.profit : 0); labels.push(String(i)); }
    every = 5;
  } else {
    for (let m = 1; m <= 12; m++) { const x = agg(ui.repY + '-' + pad(m)); vals.push(x.any ? x.profit : 0); labels.push(new Date(ui.repY, m - 1, 1).toLocaleDateString(LOC(), {month: 'short'})); }
  }
  if (vals.some(v => v)) h += `<section class="card chartbox"><h2>${month ? t('chartM') : t('chartY')}</h2>${chartSvg(vals, labels, every, month ? t('chartMa') : t('chartYa'))}</section>`;

  h += `<section class="card led"><h2>${esc(t('fullT', {p: label}))}</h2><p>${t('days', {n: r.n})}</p>` +
    lrow(t('rCSale'), '+ ' + money(r.csale)) + lrow(t('rOSale'), '+ ' + money(r.osale)) + lrow(t('rTSale'), money(r.sale), 'strong') +
    lrow(t('rCPur'), '− ' + money(r.cpur)) + lrow(t('rOPur'), '− ' + money(r.opur)) + lrow(t('rExp'), '− ' + money(r.exp)) +
    lrow(r.profit >= 0 ? t('netProfit') : t('netLoss'), money(Math.abs(r.profit)), 'tot' + (r.any ? (r.profit >= 0 ? ' good' : ' bad') : '')) +
    `</section><section class="card led"><h2>${t('cashT')}</h2><p>${t('cashS')}</p>` +
    lrow(t('rOpenTot'), money(r.open)) + lrow(t('rCashTot'), money(r.cash), 'tot' + (r.cash < 0 ? ' bad' : '')) + `</section>` +
    `<section class="card led"><h2>${t('onT')}</h2><p>${t('onS')}</p>` + lrow(t('rOnline'), money(r.online), 'tot' + (r.online < 0 ? ' bad' : '')) + `</section>`;

  const head = `<div class="trow head"><span>${month ? t('thDate') : t('thMonth')}</span><span>${t('thSales')}</span><span>${t('thCosts')}</span><span>${t('thProfit')}</span></div>`;
  const cell = x => `<b class="${x.profit >= 0 ? 'good' : 'bad'}">${money(x.profit)}</b>`;
  let rows = '';
  if (month) {
    const days = Object.keys(state.days).filter(d => d.indexOf(prefix) === 0 && totals(d).any).sort();
    rows = days.map(d => {
      const x = totals(d);
      const dl = parseYmd(d).toLocaleDateString(LOC(), {day: 'numeric', month: 'short', weekday: 'short'});
      return `<button class="trow" data-a="gotoday" data-d="${d}"><span>${esc(dl)}</span><span>${money(x.sale)}</span><span>${money(x.pur + x.exp)}</span>${cell(x)}</button>`;
    }).join('');
  } else {
    for (let m = 1; m <= 12; m++) {
      const pre = ui.repY + '-' + pad(m), x = agg(pre);
      const ml = new Date(ui.repY, m - 1, 1).toLocaleDateString(LOC(), {month: 'long'});
      rows += x.n
        ? `<button class="trow" data-a="gomonth" data-ym="${pre}"><span>${esc(ml)}</span><span>${money(x.sale)}</span><span>${money(x.pur + x.exp)}</span>${cell(x)}</button>`
        : `<div class="trow dim"><span>${esc(ml)}</span><span>—</span><span>—</span><span>—</span></div>`;
    }
  }
  if (!r.n && month) rows = `<p class="hint" style="margin:12px 0">${t('noData')}</p>`;
  h += `<p class="lab" style="margin:18px 2px 8px">${month ? t('tblDay') : t('tblMonth')}</p><div class="card tblwrap">${head}${rows}`;
  if (r.n) h += `<div class="trow foot"><span>${t('total')}</span><span>${money(r.sale)}</span><span>${money(r.pur + r.exp)}</span>${cell(r)}</div>`;
  return h + `</div><p class="hint">${month ? t('tapDay') : t('tapMonth')}</p>`;
}

/* ===== settings ===== */
function renderSet() {
  const mode = Store.mode;
  return `<h2 class="pg">${t('setT')}</h2>
  <div class="setrow"><label class="lbl" for="s_shop">${t('setShop')}</label><input class="in" id="s_shop" type="text" data-ch="shop" value="${esc(state.meta.shop)}" placeholder="${esc(t('shop'))}"></div>
  <div class="setrow"><p class="lbl">${t('setLang')}</p><div class="seg">${langBtns()}</div></div>
  <div class="setrow"><p class="lbl">${t('setWhere')}</p><p class="note" style="margin:0">${mode === 'db' ? t('whereDb') : mode === 'local' ? t('whereLocal') : t('whereMem')}</p></div>
  <div class="stack"><button class="btn wide" data-a="backup">${t('bk')}</button>
  <label class="btn wide" for="restoreFile" style="cursor:pointer">${t('rs')}</label><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>
  <section class="card formula"><h2>${t('how')}</h2><p>${t('f1')}</p><p>${t('f2')}</p><p>${t('f3')}</p><p>${t('f4')}</p><p>${t('f5')}</p></section>`;
}

/* ===== actions ===== */
const A = {
  tab(el) { ui.tab = el.dataset.t; render(); window.scrollTo(0, 0); },
  lang(el) {
    lang = el.dataset.l; state.meta.locale = lang; Store.saveMeta();
    render();
    if (ui.sheet) buildSheet();
  },
  dprev() { shiftDay(-1); },
  dnext() { shiftDay(1); },
  dtoday() { ui.date = TODAY(); render(); },
  opensheet(el) { openSheet(el.dataset.k); },
  sclose() { closeSheet(); },
  smode(el) {
    ui.mode = el.dataset.m;
    document.querySelectorAll('#s_mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === ui.mode)));
  },
  sadd() {
    const k = ui.sheet; if (!k) return;
    const amt = num($('s_amt').value), note = $('s_note').value.trim();
    if (!(amt > 0)) { toast(t('needAmt'), true); $('s_amt').focus(); return; }
    const D = ensureDay(ui.date);
    const e = {id: uid(), amt: r2(amt), note, ts: Date.now(), m: 'cash'};
    if (k === 'exp') e.m = ui.mode;
    D[k].push(e);
    Store.saveDay(ui.date);
    $('s_amt').value = ''; $('s_note').value = '';
    refreshSheet(); render();
    toast(t('saved'));
    $('s_amt').focus();
  },
  del(el) {
    const k = ui.sheet; if (!k) return;
    const id = el.dataset.id, tok = k + ':' + id;
    if (ui.del !== tok) {
      ui.del = tok;
      clearTimeout(delTimer);
      delTimer = setTimeout(() => { if (ui.del === tok) { ui.del = null; refreshSheet(); } }, 3000);
      refreshSheet();
      return;
    }
    ui.del = null; clearTimeout(delTimer);
    const D = state.days[ui.date];
    if (D) { D[k] = D[k].filter(e => e.id !== id); Store.saveDay(ui.date); }
    refreshSheet(); render();
    toast(t('removed'));
  },
  repmode(el) { ui.repMode = el.dataset.m; render(); },
  repprev() { shiftRep(-1); },
  repnext() { shiftRep(1); },
  gotoday(el) { ui.date = el.dataset.d; ui.tab = 'day'; render(); window.scrollTo(0, 0); },
  gomonth(el) { ui.repYm = el.dataset.ym; ui.repMode = 'month'; render(); window.scrollTo(0, 0); },
  async backup() {
    try {
      const data = JSON.stringify({v: 3, meta: state.meta, days: state.days});
      const fname = 'shop-accounts-backup-' + TODAY() + '.json';
      let dl = null;
      try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
      if (dl) { await dl.save({filename: fname, data}); }
      else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
        a.download = fname; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      }
      toast(t('bkOk'));
    } catch (e) { if (!(e && e.code === 'declined')) toast(t('bkFail'), true); }
  }
};
const CH = {
  shop(el) { state.meta.shop = el.value.trim(); Store.saveMeta(); $('shop').textContent = state.meta.shop || t('shop'); toast(t('saved')); }
};

function shiftDay(n) {
  const dt = parseYmd(ui.date); dt.setDate(dt.getDate() + n);
  const s = ymd(dt);
  if (s > TODAY()) return;
  ui.date = s; render();
}
function shiftRep(n) {
  if (ui.repMode === 'month') {
    const p = ui.repYm.split('-').map(Number);
    const s = ymd(new Date(p[0], p[1] - 1 + n, 1)).slice(0, 7);
    if (s > TODAY().slice(0, 7)) return;
    ui.repYm = s;
  } else {
    if (ui.repY + n > now.getFullYear()) return;
    ui.repY += n;
  }
  render();
}

async function restoreFile(file) {
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || typeof obj !== 'object' || !obj.days || typeof obj.days !== 'object') throw new Error('bad');
    toast(t('rsWait'));
    const m = normMeta(obj.meta);
    if (!state.meta.shop) state.meta.shop = m.shop;
    Object.keys(obj.days).forEach(d => { if (/^\d{4}-\d{2}-\d{2}$/.test(d)) state.days[d] = normDay(obj.days[d]); });
    await Store.saveAll();
    toast(t('rsOk'));
    render();
  } catch (e) { toast(t('rsBad'), true); }
}

/* ===== events ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dpick') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= TODAY()) { ui.date = el.value; render(); }
    return;
  }
  if (el.id === 'restoreFile') { if (el.files && el.files[0]) restoreFile(el.files[0]); el.value = ''; return; }
  if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { closeSheet(); return; }
  if (e.key === 'Enter' && (e.target.id === 's_amt' || e.target.id === 's_note')) { e.preventDefault(); A.sadd(); }
});

/* ===== start ===== */
(async function boot() {
  render();
  await Store.init();
  lang = state.meta.locale || 'en';
  ui.ready = true;
  render();
  if (Store.migrated) toast(t('migrated'));
})();
})();
</script>
</body>
</html>
